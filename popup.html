<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
    label {
      display: block;
      margin: 10px 0 4px;
      color: #555;
      font-size: 13px;
    }
    input {
      width: 100%;
      padding: 7px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 14px;
    }
    button:hover { background: #1557b0; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #progreso-container {
      display: none;
      margin-top: 12px;
    }
    #progreso-texto {
      font-size: 12px;
      color: #555;
      margin-bottom: 4px;
    }
    #progreso-barra-fondo {
      width: 100%;
      background: #e0e0e0;
      border-radius: 10px;
      height: 8px;
      overflow: hidden;
    }
    #progreso-barra {
      height: 8px;
      background: #1a73e8;
      border-radius: 10px;
      width: 0%;
      transition: width 0.3s ease;
    }
    #estado {
      margin-top: 10px;
      color: #444;
      font-size: 13px;
      min-height: 20px;
    }
    #estado.error { color: #c62828; }
    #estado.ok { color: #2e7d32; }
  </style>
</head>
<body>
  <h3 style="margin:0 0 12px">GmailZip</h3>

  <label id="label-asunto"></label>
  <input type="text" id="asunto" value="Liquidación" />

  <label id="label-dias"></label>
  <input type="number" id="dias" value="10" min="1" max="365" />

  <button id="btn"></button>

  <div id="progreso-container">
    <div id="progreso-texto"></div>
    <div id="progreso-barra-fondo">
      <div id="progreso-barra"></div>
    </div>
  </div>

  <div id="estado"></div>

  <script src="jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
